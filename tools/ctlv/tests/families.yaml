%YAML 1.2
---
# Family registry for the test corpus, covering both specs/ and bad-specs/.
# Unlike Documentation/ctlv/families.yaml it is free to change: nothing here has
# an ABI. The root family heads the list, owning family ID 0, and every
# family here inherits it. Then the two specs/ fixtures, so the parent has
# family ID 1 and the child 2, which the ID tests rely on. Everything after is a
# bad-specs/ case; ctlv-bad-unregistered is absent on purpose, a missing family
# being rejected as unregistered instead of for the mistake it demonstrates. The
# order is otherwise alphabetical, except that ctlv-bad-base-unordered comes
# before the family it inherits, which is that case's mistake.

families:
  - ctlv
  - ctlv-fixture
  - ctlv-fixture-child
  - ctlv-bad-availability-event
  - ctlv-bad-base-unordered
  - ctlv-bad-base
  - ctlv-bad-base-enum-header
  - ctlv-bad-base-enum-redeclared
  - ctlv-bad-base-fill-field
  - ctlv-bad-base-fill-reenters
  - ctlv-bad-base-filled
  - ctlv-bad-base-filled-enum-refill
  - ctlv-bad-base-filled-record-clash
  - ctlv-bad-base-filled-refill
  - ctlv-bad-base-op-clash
  - ctlv-bad-base-redeclared
  - ctlv-bad-basement-child
  - ctlv-bad-binary-unbounded
  - ctlv-bad-blob-alignment
  - ctlv-bad-blob-direction
  - ctlv-bad-blob-max-length
  - ctlv-bad-blob-reply
