# expect: availability is only valid on an action or a query op
family:
  name: ctlv-bad-availability-event
  inherits: ctlv
attr-groups:
  - name: thing
    attrs:
      - name: id
        type: uint
attr-sets:
  - name: thing-key
    attrs: thing.id
ops:
  - name: thing-changed
    type: event
    availability: dynamic
    reply:
      attrs: thing-key
