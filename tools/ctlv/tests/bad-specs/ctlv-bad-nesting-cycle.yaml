# expect: nesting cycle: thing.self -> thing.self
family:
  name: ctlv-bad-nesting-cycle
  inherits: ctlv
attr-groups:
  - name: thing
    attrs:
      - name: self
        attrs: itself
attr-sets:
  - name: itself
    attrs: thing.self
ops:
  - name: get
    type: action
    request:
      attrs: thing.self
