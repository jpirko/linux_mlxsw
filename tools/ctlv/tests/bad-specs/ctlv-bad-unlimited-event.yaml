# expect: thing.many has unlimited occurrences, which only a query reply may
family:
  name: ctlv-bad-unlimited-event
  inherits: ctlv
attr-groups:
  - name: thing
    attrs:
      - name: many
        type: uint
        max-occurrences: unlimited
ops:
  - name: happened
    type: event
    reply:
      attrs: thing.many
