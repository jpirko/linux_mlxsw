# expect: thing.many has unlimited occurrences, which only a query reply may
family:
  name: ctlv-bad-unlimited-action-reply
  inherits: ctlv
attr-groups:
  - name: thing
    attrs:
      - name: id
        type: uint
      - name: many
        type: uint
        max-occurrences: unlimited
ops:
  - name: get
    type: action
    request:
      attrs: thing.id
    reply:
      attrs: thing.many
