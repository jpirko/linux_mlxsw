%YAML 1.2
---
# Checked-in ABI snapshot of the ctlv-attestation-sim family, from
# Documentation/ctlv/specs/ctlv-attestation-sim.yaml, written by
# "make -C tools/ctlv regen".
#
# Updating the file is how a UAPI change gets reviewed; an update that
# removes or renumbers anything, narrows a bound, or makes a member required
# is an ABI break, whatever the file says afterwards.
family: {name: ctlv-attestation-sim, id: 5, inherits: ctlv-attestation}
enums:
  evidence-vendor-format: {report: 1, token: 2, manifest: 3}
records:
  device-info:
    id: 0x00010000
    fields:
      name: {number: 1, type: string, min-length: 1, max-length: 63}
fills: {device-info: device-info}
