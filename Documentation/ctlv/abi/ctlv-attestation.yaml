# SPDX-License-Identifier: ((GPL-2.0 WITH Linux-syscall-note) OR BSD-3-Clause)
%YAML 1.2
---
# Checked-in ABI snapshot of the ctlv-attestation family, written by
# "make -C tools/ctlv abi-update".
#
# The checker compares this family's declarations and inherited stub fills
# against this file. Updating it is how a UAPI change gets reviewed; an update
# that removes or renumbers anything, narrows a bound, or makes a placement
# required is an ABI break, whatever this file says afterwards.
family: {name: ctlv-attestation, id: 1, inherits: ctlv, post-init: true,
         pre-fini: true}
enums:
  evidence-representation: {raw: 1}
  evidence-blob-class: {primary: 1}
  mr-log-event: {info: 1, extend: 2}
  tdisp-state: {unlocked: 1, locked: 2, run: 3, error: 4}
  device-trust-state: {unset: 1, none: 2, adversary: 3, auto: 4, tcb: 5}
flags:
  mr-device-caps: {read: 0, extend: 1}
  mr-caps: {read: 0, extend: 1}
  mr-state-flags: {ima-active: 0}
  evidence-caps: {evidence-accept: 0}
  devsec-caps: {run: 0}
attr-groups:
  device:
    id: 1
    attrs:
      generation: {id: 1, type: uint, max: 4294967295}
      caps: {id: 2, type: nested}
      info: {id: 3, type: nested}
  cap:
    id: 2
    attrs:
      evidence: {id: 1, type: nested}
      mr: {id: 2, type: nested}
      min-challenge-length: {id: 3, type: uint}
      max-challenge-length: {id: 4, type: uint}
      max-total-output-length: {id: 5, type: uint}
      mr-flags: {id: 6, flags: mr-device-caps}
      object: {id: 7, type: nested, max-occurrences: 16}
      blob-class: {id: 8, enum: evidence-blob-class}
      format: {id: 9, type: string, min-length: 1, max-length: 128}
      representation: {id: 10, enum: evidence-representation}
      max-length: {id: 11, type: uint}
      evidence-flags: {id: 12, flags: evidence-caps}
      devsec: {id: 13, type: nested}
      devsec-flags: {id: 14, flags: devsec-caps}
  evidence:
    id: 3
    attrs:
      challenge: {id: 1, type: binary, max-length: 4096}
      object: {id: 2, type: nested, max-occurrences: 16}
      blob-class: {id: 3, enum: evidence-blob-class}
      format: {id: 4, type: string, min-length: 1, max-length: 128}
      representation: {id: 5, enum: evidence-representation}
      data: {id: 6, blob: output, backings: [va, memfd, dma-buf],
             max-length: 4294967295}
      object-length: {id: 7, type: uint, max-occurrences: 16}
      generation: {id: 8, type: uint, max: 4294967295}
      accepted-generation: {id: 9, type: uint, max: 4294967295}
  mr:
    id: 4
    attrs:
      id: {id: 1, type: uint, max: 4294967295}
      name: {id: 2, type: string, min-length: 1, max-length: 128}
      hash-algo: {id: 3, type: uint, max: 20}
      supported-hash-algo: {id: 4, type: uint, max: 20, max-occurrences: 21}
      register-index: {id: 5, type: uint, max: 4294967295}
      caps: {id: 6, flags: mr-caps}
      item: {id: 7, type: nested, max-occurrences: unlimited}
      value: {id: 8, type: nested, max-occurrences: 21}
      data: {id: 9, type: binary, min-length: 16, max-length: 64}
      generation: {id: 10, type: uint, max: 4294967295}
      state-flags: {id: 11, flags: mr-state-flags}
      selection: {id: 12, type: nested, max-occurrences: 256}
      start-generation: {id: 13, type: uint, max: 4294967295}
      end-generation: {id: 14, type: uint, max: 4294967295}
  log:
    id: 5
    attrs:
      entry: {id: 1, type: nested, max-occurrences: unlimited}
      event: {id: 2, enum: mr-log-event}
      mr: {id: 3, type: nested}
      ima: {id: 4, type: nested}
      template-name: {id: 5, type: string, min-length: 1, max-length: 128}
      template-data: {id: 6, type: binary, max-length: 65536}
      violation: {id: 7, type: bool}
  notification:
    id: 6
    attrs:
      entry: {id: 1, type: nested}
  devsec:
    id: 7
    attrs:
      tdisp-state: {id: 1, enum: tdisp-state}
      device-trust: {id: 2, enum: device-trust-state}
attr-sets:
  device-info: {id: 1, stub: true}
  evidence-object-cap: {id: 2}
  evidence-cap: {id: 3}
  mr-device-cap: {id: 4}
  device-caps: {id: 5}
  device-reply: {id: 6}
  evidence-object-request: {id: 7}
  evidence-request: {id: 8}
  evidence-reply: {id: 9}
  mr-props: {id: 10}
  mr-dump-entry: {id: 11}
  mr-id-request: {id: 12}
  mr-read-request: {id: 13}
  mr-value: {id: 14}
  mr-read-reply: {id: 15}
  mr-extend-request: {id: 16}
  mr-change-reply: {id: 17}
  mr-log-info: {id: 18}
  mr-log-entry: {id: 19}
  device-state-event: {id: 20}
  mr-log-event: {id: 21}
  mr-log-ima: {id: 22}
  devsec-cap: {id: 23}
  evidence-generation-request: {id: 24}
  devsec-state-reply: {id: 25}
  devsec-run-reply: {id: 26}
  evidence-state-event: {id: 27}
  mr-log-selection: {id: 28}
  mr-log-request: {id: 29}
  mr-log-reply: {id: 30}
ops:
  device-get:
    abi: {id: 1, type: action, fd-access: read}
    reply:
      attrs:
        - device.generation
        - device.caps:
            optional-attrs:
              - cap.evidence:
                  attrs:
                    - cap.min-challenge-length
                    - cap.max-challenge-length
                    - cap.max-total-output-length
                    - cap.object:
                        attrs: [cap.blob-class, cap.format, cap.representation,
                                cap.max-length]
                  optional-attrs: [cap.evidence-flags]
              - cap.mr: {attrs: [cap.mr-flags]}
              - cap.devsec: {attrs: [cap.devsec-flags]}
        - device.info: {attrs: [device-info]}
  evidence-get:
    abi: {id: 2, type: action, availability: dynamic, optional: true}
    request:
      attrs:
        - evidence.challenge
        - evidence.object:
            attrs: [evidence.blob-class, evidence.format,
                    evidence.representation, evidence.data]
      optional-attrs: [device.generation]
    reply:
      attrs: [device.generation, evidence.object-length]
      optional-attrs: [mr.generation, evidence.generation]
  mr-get:
    abi: {id: 3, type: action, fd-access: read, optional: true}
    request: {attrs: [mr.id]}
    reply:
      attrs: [mr.name, mr.supported-hash-algo, mr.caps]
      optional-attrs: [mr.register-index]
  mr-dump:
    abi: {id: 4, type: query, fd-access: read, optional: true}
    reply:
      attrs:
        - mr.item:
            attrs: [mr.id, mr.name, mr.supported-hash-algo, mr.caps]
            optional-attrs: [mr.register-index]
  mr-read:
    abi: {id: 5, type: query, fd-access: read, optional: true}
    request:
      attrs: [mr.id]
      optional-attrs: [device.generation]
    reply:
      attrs:
        - device.generation
        - mr.generation
        - mr.value: {attrs: [mr.hash-algo, mr.data]}
  mr-extend:
    abi: {id: 6, type: action, optional: true}
    request:
      attrs:
        - mr.id
        - mr.value: {attrs: [mr.hash-algo, mr.data]}
      optional-attrs: [device.generation]
    reply: {attrs: [device.generation, mr.generation]}
  device-state-changed:
    abi: {id: 7, type: event}
    reply: {attrs: [device.generation]}
  mr-log-entry-appended:
    abi: {id: 8, type: event}
    reply:
      attrs:
        - notification.entry:
            attrs: [mr.generation, device.generation, mr.id, log.event]
            optional-attrs:
              - mr.value: {attrs: [mr.hash-algo, mr.data]}
              - log.mr:
                  attrs: [mr.name, mr.supported-hash-algo, mr.caps]
                  optional-attrs: [mr.register-index]
              - log.ima:
                  attrs: [log.template-name, log.template-data, log.violation]
  evidence-accept:
    abi: {id: 9, type: action, optional: true}
    request: {attrs: [device.generation, evidence.generation]}
  evidence-accept-clear:
    abi: {id: 10, type: action, optional: true}
  devsec-state-get:
    abi: {id: 11, type: query, fd-access: read, optional: true}
    reply:
      attrs: [device.generation]
      optional-attrs: [evidence.generation, evidence.accepted-generation,
                       devsec.tdisp-state, devsec.device-trust]
  devsec-run:
    abi: {id: 12, type: action, availability: dynamic, optional: true}
    request: {attrs: [device.generation, evidence.generation]}
    reply: {attrs: [device.generation]}
  evidence-state-changed:
    abi: {id: 13, type: event}
    reply:
      attrs: [device.generation]
      optional-attrs: [evidence.generation, evidence.accepted-generation]
  mr-log-get:
    abi: {id: 14, type: query, fd-access: read, optional: true}
    request:
      optional-attrs:
        - mr.selection: {attrs: [mr.id]}
        - mr.start-generation
        - mr.end-generation
    reply:
      optional-attrs:
        - mr.start-generation
        - mr.end-generation
        - log.entry:
            attrs: [mr.generation, device.generation, mr.id, log.event]
            optional-attrs:
              - mr.value: {attrs: [mr.hash-algo, mr.data]}
              - log.mr:
                  attrs: [mr.name, mr.supported-hash-algo, mr.caps]
                  optional-attrs: [mr.register-index]
              - log.ima:
                  attrs: [log.template-name, log.template-data, log.violation]
