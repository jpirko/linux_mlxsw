%YAML 1.2
---
# Checked-in ABI snapshot of the ctlv-attestation family, from
# Documentation/ctlv/specs/ctlv-attestation.yaml, written by
# "make -C tools/ctlv regen".
#
# Updating the file is how a UAPI change gets reviewed; an update that
# removes or renumbers anything, narrows a bound, or makes a member required
# is an ABI break, whatever the file says afterwards.
family: {name: ctlv-attestation, id: 1, inherits: ctlv}
enums:
  evidence-class: {signed: 1, event-log: 2, cert-chain: 3, auxiliary: 4}
  evidence-format: {ccel: 1, spdm-cert-chain: 2, spdm-transcript: 3,
                    spdm-measurements: 4, tdisp-report: 5, tpm-quote: 6,
                    tpm-event-log: 7, tpm-ek-cert: 8}
  mr-log-event: {info: 1, extend: 2}
  tdisp-state: {unlocked: 1, locked: 2, run: 3, error: 4}
  hash-algo: {$header: linux/hash_info.h, $enum: hash_algo,
              $end: HASH_ALGO__LAST}
flags:
  mr-device-caps: {extend: 0, dynamic-topology: 1}
  mr-caps: {extend: 0, removable: 1}
  mr-state-flags: {ima-active: 0}
  evidence-caps: {evidence-accept: 0, mr-selection: 1, privlevel: 2, service: 3}
records:
  mr-desc:
    id: 0x00010000
    fields:
      name: {number: 1, type: string, min-length: 1, max-length: 128}
      supported-hash-algorithms: {number: 2, enum: hash-algo,
                                  max-occurrences: hash-algo}
      caps: {number: 3, flags: mr-caps}
      register-index: {number: 4, type: uint, max: u32-max, optional: true}
      state-flags: {number: 5, flags: mr-state-flags, optional: true}
  mr-value:
    id: 0x00020000
    fields:
      hash-algo: {number: 1, enum: hash-algo}
      data: {number: 2, type: binary, min-length: 16, max-length: 64}
  mr-generation:
    id: 0x00030000
    fields:
      mr-generation: {number: 1, type: uint, max: u32-max}
  mr-values:
    id: 0x00040000
    fields:
      mr-values: {number: 1, record: mr-value, max-occurrences: hash-algo}
  mr-log-entry:
    id: 0x00050000
    fields:
      mr-id: {number: 1, type: uint, max: u32-max}
      event: {number: 2, enum: mr-log-event}
      mr: {number: 3, record: mr-log-entry.mr, optional: true}
      ima: {number: 4, record: mr-log-entry.ima, optional: true}
      record: {number: 5, record: mr-log-entry.record, optional: true}
    members: [record mr-generation, record device-generation,
              'record mr-values?']
  mr-log-entry.mr:
    id: 0x00051000
    fields:
      name: {number: 1, type: string, min-length: 1, max-length: 128}
      supported-hash-algorithms: {number: 2, enum: hash-algo,
                                  max-occurrences: hash-algo}
      caps: {number: 3, flags: mr-caps}
      register-index: {number: 4, type: uint, max: u32-max, optional: true}
  mr-log-entry.ima:
    id: 0x00052000
    fields:
      template-name: {number: 1, type: string, min-length: 1, max-length: 128}
      template-data: {number: 2, type: binary, max-length: 64K}
      violation: {number: 3, type: bool}
  mr-log-entry.record:
    id: 0x00053000
    fields:
      format: {number: 1, type: string, min-length: 1, max-length: 128}
      data: {number: 2, type: binary, max-length: 4K}
  mr-start-generation:
    id: 0x00060000
    fields:
      mr-start-generation: {number: 1, type: uint, max: u32-max}
  mr-end-generation:
    id: 0x00070000
    fields:
      mr-end-generation: {number: 1, type: uint, max: u32-max}
  device-generation:
    id: 0x00080000
    fields:
      device-generation: {number: 1, type: uint, max: u32-max}
  device-get request:
    id: 0x80010000
  device-get reply:
    id: 0xc0010000
    fields:
      caps: {number: 1, record: device-get caps}
      info: {number: 2, extension: device-info}
    members: [record device-generation]
  device-get caps:
    id: 0xc0011000
    fields:
      evidence: {number: 1, record: device-get caps.evidence, optional: true}
      mr: {number: 2, record: device-get caps.mr, optional: true}
  device-get caps.evidence:
    id: 0xc0011100
    fields:
      objects: {number: 1, record: device-get caps.evidence.objects,
                max-occurrences: 16}
      flags: {number: 2, flags: evidence-caps, optional: true}
  device-get caps.evidence.objects:
    id: 0xc0011110
    fields:
      id: {number: 1, type: uint, max: 15}
      class: {number: 2, enum: evidence-class}
      formats: {number: 3, enum: evidence-format, max-occurrences: 4,
                optional: true}
      vendor-formats: {number: 4, enum: evidence-vendor-format,
                       max-occurrences: 4, optional: true}
      max-length: {number: 5, type: uint}
      challenge-lengths:
        {number: 6, record: device-get caps.evidence.objects.challenge-lengths,
         max-occurrences: 8, optional: true}
      instance: {number: 7, type: uint, max: u32-max, optional: true}
      tcb-digest-algo: {number: 8, enum: hash-algo, optional: true}
  device-get caps.evidence.objects.challenge-lengths:
    id: 0xc0011111
    fields:
      length: {number: 1, type: uint, min: 1, max: 4K, unit: bytes,
               optional: true}
      min-length: {number: 2, type: uint, min: 1, max: 4K, unit: bytes,
                   optional: true}
      max-length: {number: 3, type: uint, min: 1, max: 4K, unit: bytes,
                   optional: true}
  device-get caps.mr:
    id: 0xc0011200
    fields:
      flags: {number: 1, flags: mr-device-caps}
  evidence-get request:
    id: 0x80020000
    fields:
      challenge: {number: 1, type: binary, min-length: 1, max-length: 4K,
                  optional: true}
      objects: {number: 2, record: evidence-get objects, max-occurrences: 16}
      selection: {number: 3, record: evidence-get selection,
                  max-occurrences: 256, optional: true}
      privlevel: {number: 4, type: uint, max: u32-max, optional: true}
      service-provider: {number: 5, type: string, min-length: 1,
                         max-length: 128, optional: true}
      service-guid: {number: 6, type: binary, length: 16, optional: true}
      service-manifest-version: {number: 7, type: uint, max: u32-max,
                                 optional: true}
      options: {number: 8, extension: evidence-options, optional: true}
    members: ['record device-generation?']
  evidence-get objects:
    id: 0x80021000
    fields:
      id: {number: 1, type: uint, max: 15}
      data: {number: 2, blob: output, backings: [va, memfd, dma-buf],
             max-length: u32-max}
  evidence-get selection:
    id: 0x80022000
    fields:
      id: {number: 1, type: uint, max: u32-max}
      hash-algo: {number: 2, enum: hash-algo}
  evidence-get reply:
    id: 0xc0020000
    fields:
      results: {number: 1, record: evidence-get results, max-occurrences: 16}
      evidence-generation: {number: 2, type: uint, max: u32-max, optional: true}
    members: [record device-generation, 'record mr-generation?']
  evidence-get results:
    id: 0xc0021000
    fields:
      format: {number: 1, enum: evidence-format, optional: true}
      vendor-format: {number: 2, enum: evidence-vendor-format, optional: true}
      length: {number: 3, type: uint}
      tcb-digest: {number: 4, record: evidence-get results.tcb-digest,
                   optional: true}
  evidence-get results.tcb-digest:
    id: 0xc0021100
    fields:
      hash-algo: {number: 1, enum: hash-algo}
      data: {number: 2, type: binary, min-length: 16, max-length: 64}
  mr-get request:
    id: 0x80030000
    fields:
      id: {number: 1, type: uint, max: u32-max, optional: true}
  mr-get reply:
    id: 0xc0030000
    fields:
      items: {number: 1, record: mr-get items, max-occurrences: unlimited}
  mr-get items:
    id: 0xc0031000
    fields:
      id: {number: 1, type: uint, max: u32-max}
    members: [$include mr-desc]
  mr-read request:
    id: 0x80040000
    fields:
      id: {number: 1, type: uint, max: u32-max}
      options: {number: 2, extension: mr-options, optional: true}
    members: ['record device-generation?']
  mr-read reply:
    id: 0xc0040000
    members: [record device-generation, record mr-generation, record mr-values]
  mr-extend request:
    id: 0x80050000
    fields:
      id: {number: 1, type: uint, max: u32-max}
      options: {number: 2, extension: mr-options, optional: true}
      record: {number: 3, record: mr-extend record, optional: true}
    members: [record mr-values, 'record device-generation?']
  mr-extend record:
    id: 0x80051000
    fields:
      format: {number: 1, type: string, min-length: 1, max-length: 128}
      data: {number: 2, type: binary, max-length: 4K}
  mr-extend reply:
    id: 0xc0050000
    members: [record device-generation, record mr-generation]
  device-state-changed payload:
    id: 0xc0060000
    members: [record device-generation]
  mr-log-entry-appended payload:
    id: 0xc0070000
    fields:
      entry: {number: 1, record: mr-log-entry}
  evidence-accept request:
    id: 0x80080000
    fields:
      evidence-generation: {number: 1, type: uint, max: u32-max}
    members: [record device-generation]
  evidence-accept reply:
    id: 0xc0080000
    members: [record device-generation]
  devsec-state-get request:
    id: 0x80090000
  devsec-state-get reply:
    id: 0xc0090000
    fields:
      tdisp-state: {number: 1, enum: tdisp-state, optional: true}
    members: [record device-generation]
  evidence-state-changed payload:
    id: 0xc00a0000
    fields:
      evidence-generation: {number: 1, type: uint, max: u32-max, optional: true}
    members: [record device-generation]
  mr-log-get request:
    id: 0x800b0000
    fields:
      selection: {number: 1, record: mr-log-get selection, max-occurrences: 256,
                  optional: true}
    members: ['record mr-start-generation?', 'record mr-end-generation?']
  mr-log-get selection:
    id: 0x800b1000
    fields:
      id: {number: 1, type: uint, max: u32-max}
  mr-log-get reply:
    id: 0xc00b0000
    fields:
      entries: {number: 1, record: mr-log-entry, max-occurrences: unlimited,
                optional: true}
    members: ['record mr-start-generation?', 'record mr-end-generation?']
extensions: {device-info: 1, evidence-options: 2, mr-options: 3}
enum-extensions: {evidence-vendor-format: 1}
ops:
  device-get: {id: 1, type: action, fd-access: read,
               request: device-get request, reply: device-get reply}
  evidence-get: {id: 2, type: action, availability: dynamic, optional: true,
                 request: evidence-get request, reply: evidence-get reply}
  mr-get: {id: 3, type: query, fd-access: read, optional: true,
           request: mr-get request, reply: mr-get reply}
  mr-read: {id: 4, type: query, fd-access: read, optional: true,
            request: mr-read request, reply: mr-read reply}
  mr-extend: {id: 5, type: action, optional: true, request: mr-extend request,
              reply: mr-extend reply}
  device-state-changed: {id: 6, type: event,
                         payload: device-state-changed payload}
  mr-log-entry-appended: {id: 7, type: event,
                          payload: mr-log-entry-appended payload}
  evidence-accept: {id: 8, type: action, availability: dynamic, optional: true,
                    request: evidence-accept request,
                    reply: evidence-accept reply}
  devsec-state-get: {id: 9, type: query, fd-access: read, optional: true,
                     request: devsec-state-get request,
                     reply: devsec-state-get reply}
  evidence-state-changed: {id: 10, type: event,
                           payload: evidence-state-changed payload}
  mr-log-get: {id: 11, type: query, fd-access: read, optional: true,
               request: mr-log-get request, reply: mr-log-get reply}
