# SPDX-License-Identifier: ((GPL-2.0 WITH Linux-syscall-note) OR BSD-3-Clause)
%YAML 1.2
---
family:
  name: ctlv-attestation
  inherits: ctlv
  post-init: true
  pre-fini: true

enums:
  - name: evidence-representation
    values:
      - raw

  - name: evidence-blob-class
    values:
      - primary

  - name: mr-log-event
    values:
      - info
      - extend

  - name: tdisp-state
    values:
      - unlocked
      - locked
      - run
      - error

  - name: device-trust-state
    values:
      - unset
      - none
      - adversary
      - auto
      - tcb

flags:
  - name: mr-device-caps
    values:
      - read
      - extend

  - name: mr-caps
    values:
      - read
      - extend

  - name: mr-state-flags
    values:
      - ima-active

  - name: evidence-caps
    values:
      - evidence-accept

  - name: devsec-caps
    values:
      - run

attr-groups:
  - name: device
    attrs:
      # Reserved until provider-driven state changes are introduced.
      - name: generation
        type: uint
        max: 4294967295
      - name: caps
        attrs: device-caps
      - name: info
        attrs: device-info

  - name: cap
    attrs:
      - name: evidence
        attrs: evidence-cap
      - name: mr
        attrs: mr-device-cap
      - name: min-challenge-length
        type: uint
      - name: max-challenge-length
        type: uint
      - name: max-total-output-length
        type: uint
      - name: mr-flags
        flags: mr-device-caps
      - name: object
        attrs: evidence-object-cap
        max-occurrences: 16
      - name: blob-class
        enum: evidence-blob-class
      - name: format
        type: string
        min-length: 1
        max-length: 128
      - name: representation
        enum: evidence-representation
      - name: max-length
        type: uint
      - name: evidence-flags
        flags: evidence-caps
      - name: devsec
        attrs: devsec-cap
      - name: devsec-flags
        flags: devsec-caps

  - name: evidence
    attrs:
      - name: challenge
        type: binary
        max-length: 4096
      - name: object
        attrs: evidence-object-request
        max-occurrences: 16
      - name: blob-class
        enum: evidence-blob-class
      - name: format
        type: string
        min-length: 1
        max-length: 128
      - name: representation
        enum: evidence-representation
      - name: data
        blob:
          direction: output
          allowed-backings: [ va, memfd, dma-buf ]
          max-length: 4294967295
          alignment: 1
      - name: object-length
        type: uint
        max-occurrences: 16
      - name: generation
        type: uint
        max: 4294967295
      - name: accepted-generation
        type: uint
        max: 4294967295

  - name: mr
    attrs:
      - name: id
        type: uint
        max: 4294967295
      - name: name
        type: string
        min-length: 1
        max-length: 128
      - name: hash-algo
        type: uint
        max: 20
      - name: supported-hash-algo
        type: uint
        max: 20
        max-occurrences: 21
      - name: register-index
        type: uint
        max: 4294967295
      - name: caps
        flags: mr-caps
      - name: item
        attrs: mr-dump-entry
        max-occurrences: unlimited
      - name: value
        attrs: mr-value
        max-occurrences: 21
      - name: data
        type: binary
        min-length: 16
        max-length: 64
      - name: generation
        type: uint
        max: 4294967295
      - name: state-flags
        flags: mr-state-flags
      - name: selection
        attrs: mr-log-selection
        max-occurrences: 256
      - name: start-generation
        type: uint
        max: 4294967295
      - name: end-generation
        type: uint
        max: 4294967295

  - name: log
    attrs:
      - name: entry
        attrs: mr-log-entry
        max-occurrences: unlimited
      - name: event
        enum: mr-log-event
      - name: mr
        attrs: mr-log-info
      - name: ima
        attrs: mr-log-ima
      - name: template-name
        type: string
        min-length: 1
        max-length: 128
      - name: template-data
        type: binary
        max-length: 65536
      - name: violation
        type: bool

  - name: notification
    attrs:
      - name: entry
        attrs: mr-log-entry

  - name: devsec
    attrs:
      - name: tdisp-state
        enum: tdisp-state
      - name: device-trust
        enum: device-trust-state

attr-sets:
  - name: device-info
    stub: true

  - name: evidence-object-cap
    attrs:
      - cap.blob-class
      - cap.format
      - cap.representation
      - cap.max-length

  - name: evidence-cap
    attrs:
      - cap.min-challenge-length
      - cap.max-challenge-length
      - cap.max-total-output-length
      - cap.object
    optional-attrs: cap.evidence-flags

  - name: mr-device-cap
    attrs: cap.mr-flags

  - name: device-caps
    optional-attrs:
      - cap.evidence
      - cap.mr
      - cap.devsec

  - name: device-reply
    attrs:
      - device.generation
      - device.caps
      - device.info

  - name: evidence-object-request
    attrs:
      - evidence.blob-class
      - evidence.format
      - evidence.representation
      - evidence.data

  - name: evidence-request
    attrs:
      - evidence.challenge
      - evidence.object
    optional-attrs: device.generation

  - name: evidence-reply
    attrs:
      - device.generation
      - evidence.object-length
    optional-attrs:
      - mr.generation
      - evidence.generation

  - name: mr-props
    attrs:
      - mr.name
      - mr.supported-hash-algo
      - mr.caps
    optional-attrs: mr.register-index

  - name: mr-dump-entry
    attrs:
      - mr.id
      - mr.name
      - mr.supported-hash-algo
      - mr.caps
    optional-attrs: mr.register-index

  - name: mr-id-request
    attrs: mr.id

  - name: mr-read-request
    attrs: mr.id
    optional-attrs: device.generation

  - name: mr-value
    attrs:
      - mr.hash-algo
      - mr.data

  - name: mr-read-reply
    attrs:
      - device.generation
      - mr.generation
      - mr.value

  - name: mr-extend-request
    attrs:
      - mr.id
      - mr.value
    optional-attrs: device.generation

  - name: mr-change-reply
    attrs:
      - device.generation
      - mr.generation

  - name: mr-log-info
    attrs:
      - mr.name
      - mr.supported-hash-algo
      - mr.caps
    optional-attrs: mr.register-index

  - name: mr-log-entry
    attrs:
      - mr.generation
      - device.generation
      - mr.id
      - log.event
    optional-attrs:
      - mr.value
      - log.mr
      - log.ima

  - name: device-state-event
    attrs: device.generation

  - name: mr-log-event
    attrs: notification.entry

  - name: mr-log-ima
    attrs:
      - log.template-name
      - log.template-data
      - log.violation

  - name: devsec-cap
    attrs: cap.devsec-flags

  - name: evidence-generation-request
    attrs:
      - device.generation
      - evidence.generation

  - name: devsec-state-reply
    attrs: device.generation
    optional-attrs:
      - evidence.generation
      - evidence.accepted-generation
      - devsec.tdisp-state
      - devsec.device-trust

  - name: devsec-run-reply
    attrs: device.generation

  - name: evidence-state-event
    attrs: device.generation
    optional-attrs:
      - evidence.generation
      - evidence.accepted-generation

  - name: mr-log-selection
    attrs: mr.id

  - name: mr-log-request
    optional-attrs:
      - mr.selection
      - mr.start-generation
      - mr.end-generation

  - name: mr-log-reply
    optional-attrs:
      - mr.start-generation
      - mr.end-generation
      - log.entry

ops:
  - name: device-get
    type: action
    fd-access: read
    reply:
      attrs: device-reply

  - name: evidence-get
    type: action
    fd-access: read-write
    availability: dynamic
    optional: true
    request:
      attrs: evidence-request
    reply:
      attrs: evidence-reply

  - name: mr-get
    type: action
    fd-access: read
    optional: true
    request:
      attrs: mr-id-request
    reply:
      attrs: mr-props

  - name: mr-dump
    type: query
    fd-access: read
    optional: true
    reply:
      attrs: mr.item
    suggested-reply-length: 4096

  - name: mr-read
    type: query
    fd-access: read
    optional: true
    request:
      attrs: mr-read-request
    reply:
      attrs: mr-read-reply
    suggested-reply-length: 4096

  - name: mr-extend
    type: action
    fd-access: read-write
    optional: true
    request:
      attrs: mr-extend-request
    reply:
      attrs: mr-change-reply

  - name: device-state-changed
    type: event
    reply:
      attrs: device-state-event

  - name: mr-log-entry-appended
    type: event
    reply:
      attrs: mr-log-event

  - name: evidence-accept
    type: action
    fd-access: read-write
    optional: true
    request:
      attrs: evidence-generation-request

  - name: evidence-accept-clear
    type: action
    fd-access: read-write
    optional: true

  - name: devsec-state-get
    type: query
    fd-access: read
    optional: true
    reply:
      attrs: devsec-state-reply
    suggested-reply-length: 1024

  - name: devsec-run
    type: action
    fd-access: read-write
    availability: dynamic
    optional: true
    request:
      attrs: evidence-generation-request
    reply:
      attrs: devsec-run-reply

  - name: evidence-state-changed
    type: event
    reply:
      attrs: evidence-state-event

  - name: mr-log-get
    type: query
    fd-access: read
    optional: true
    request:
      attrs: mr-log-request
    reply:
      attrs: mr-log-reply
    suggested-reply-length: 131072
