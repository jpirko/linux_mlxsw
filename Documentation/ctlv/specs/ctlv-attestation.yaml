# SPDX-License-Identifier: ((GPL-2.0 WITH Linux-syscall-note) OR BSD-3-Clause)
%YAML 1.2
---
# Attestation devices: evidence and measurement registers (MRs). The device's
# family inherits this one, fills device-info and gives evidence-vendor-format
# the formats its vendor defines.
family: ctlv-attestation
inherits: ctlv

enums:
  # What an evidence object is.
  evidence-class:
    # Made by evidence-get over its challenge, and signed by the root of
    # trust.
    - signed
    # The platform's log of what firmware and the boot chain measured into
    # the MRs. Later extends, through mr-extend or otherwise, are not in it.
    - event-log
    # The certificates that chain a signing key to its vendor's root.
    - cert-chain
    # Anything else a verifier reads beside the signed objects.
    - auxiliary
  # A layout of an evidence object that a standard defines.
  evidence-format:
    # The log area of an ACPI CCEL table, a TCG crypto-agile event log.
    - ccel
    # An SPDM certificate chain.
    - spdm-cert-chain
    # An SPDM message transcript, starting with VCA.
    - spdm-transcript
    # An SPDM GET_MEASUREMENTS response.
    - spdm-measurements
    # A TDISP interface report.
    - tdisp-report
    # TPM2_Quote's attestation structure and signature.
    - tpm-quote
    # A TCG PC Client crypto-agile event log.
    - tpm-event-log
    # A TPM's EK certificate, read from its NV.
    - tpm-ek-cert
  # A layout of an evidence object that one vendor defines, given by the
  # device's family.
  evidence-vendor-format: extension
  # What a journal entry records.
  mr-log-event:
    # Describes an MR.
    - info
    # Records an extension of an MR.
    - extend
  # The TDISP state of a device interface.
  tdisp-state:
    # TDISP's CONFIG_UNLOCKED.
    - unlocked
    # TDISP's CONFIG_LOCKED.
    - locked
    # TDISP's RUN.
    - run
    # TDISP's ERROR.
    - error
  # The kernel's hash algorithms.
  hash-algo:
    $header: linux/hash_info.h
    $enum: hash_algo
    $end: HASH_ALGO__LAST

flags:
  # What a device offers for its MRs.
  mr-device-caps:
    # mr-extend is provided.
    - extend
    # MRs may come and go while the device lives.
    - dynamic-topology
  # What one MR allows.
  mr-caps:
    # The MR may be extended.
    - extend
    # The provider may remove the MR.
    - removable
  # The state of one MR.
  mr-state-flags:
    # IMA extends this MR.
    - ima-active
  # What a device offers for its evidence.
  evidence-caps:
    # evidence-accept is provided.
    - evidence-accept
    # evidence-get takes mr-selection.
    - mr-selection
    # evidence-get takes privlevel.
    - privlevel
    # evidence-get takes service.
    - service

records:
  # One MR, as mr-get describes it.
  mr-desc:
    # The platform's name for the MR, such as rtmr0.
    name: string(1..128)
    # Its banks, each once, in the provider's order.
    supported-hash-algorithms[hash-algo]: hash-algo
    # What it allows, and whether the provider may remove it.
    caps: mr-caps
    # The hardware's number for the MR, where it has one: 0 for rtmr0.
    register-index?: uint(..u32-max)
    # ima-active while IMA extends it.
    state-flags?: mr-state-flags

  # One bank of an MR.
  mr-value:
    # The bank's algorithm.
    hash-algo: hash-algo
    # The digest, as long as hash-algo's.
    data: binary(16..64)

  # The device's MR generation, which each extend bumps.
  mr-generation: uint(..u32-max)

  # Values for banks of the MR, each bank once.
  mr-values[hash-algo]: record mr-value

  # One journal entry, as mr-log-get and mr-log-entry-appended carry it.
  mr-log-entry:
    mr-generation: record
    device-generation: record
    # The ID of the MR the entry is about.
    mr-id: uint(..u32-max)
    # What the entry records.
    event: mr-log-event
    mr-values?: record
    # The MR an info entry describes.
    mr?:
      # The platform's name for the MR.
      name: string(1..128)
      # Its banks, each once, in the provider's order.
      supported-hash-algorithms[hash-algo]: hash-algo
      # What it allows, and whether the provider may remove it.
      caps: mr-caps
      # The hardware's number for the MR, where it has one.
      register-index?: uint(..u32-max)
    # IMA's measurement, on an extend entry IMA made.
    ima?:
      # The IMA template, such as ima-ng.
      template-name: string(1..128)
      # The template's fields, as IMA's binary measurement list has them.
      template-data: binary(..64K)
      # The entry records an IMA violation, not a measurement.
      violation: bool
    # What was measured, on an extend entry mr-extend made with a record.
    record?:
      # The layout of data, in printable ASCII without spaces.
      format: string(1..128)
      # What was measured, laid out as format says.
      data: binary(..4K)

  # The first MR generation of the range mr-log-get selects and reports.
  mr-start-generation: uint(..u32-max)
  # The last MR generation of that range.
  mr-end-generation: uint(..u32-max)

  # Advances with each change of the device's state.
  device-generation: uint(..u32-max)

ops:
  # What the device can do, and its family's fields.
  device-get:
    type: action
    fd-access: read
    reply:
      device-generation: record
      # What the device supports, fixed for its life.
      caps:
        # Present when the device produces evidence.
        evidence?:
          # One per object evidence-get can produce.
          objects[16]:
            # The device's handle for the object in requests.
            id: uint(..15)
            # What the object is.
            class: evidence-class
            # The layouts a standard defines that the object may have. At
            # least one of formats and vendor-formats is present.
            formats[4]?: evidence-format
            # The layouts its vendor defines that the object may have.
            vendor-formats[4]?: evidence-vendor-format
            # The longest the object gets; a blob this long always holds it.
            max-length: uint
            # A signed object's challenge lengths: each entry is one length,
            # or a range from min-length to max-length.
            challenge-lengths[8]?:
              # A single length.
              length?: uint(1..4K, bytes)
              # The shortest of a range.
              min-length?: uint(1..4K, bytes)
              # The longest of a range.
              max-length?: uint(1..4K, bytes)
            # Tells apart the objects of one kind, such as an SPDM slot.
            instance?: uint(..u32-max)
            # Where the TCB vouches for the object with a digest, its
            # algorithm.
            tcb-digest-algo?: hash-algo
          # The optional evidence features the device provides.
          flags?: evidence-caps
        # Present when the device has MRs.
        mr?:
          # The MR operations the device provides, and whether MRs come and go.
          flags: mr-device-caps
      # The device's family's fields.
      info: extension device-info

  # Evidence objects, written into the caller's blobs. A signed object is made
  # by the call, over the challenge, and never reused; the others are read as
  # they stand at the call.
  evidence-get:
    type: action
    fd-access: read-write
    availability: dynamic
    optional: true
    request:
      # Bound into each signed object named: pass a verifier's nonce, or a hash
      # binding one to your context, never data a peer chose. Present exactly
      # when a signed object is named, and of a length each of them takes.
      challenge?: binary(1..4K)
      # The objects to produce, each named once.
      objects[16]:
        # The object, by the ID device-get lists.
        id: uint(..15)
        # Where the object is written. One too short for it fails the op with
        # EMSGSIZE, and error-info's required-length says how long it has to
        # be.
        data: blob(out, va memfd dma-buf)
      device-generation?: record
      # The MR banks the evidence reports, where the device takes mr-selection.
      selection[256]?:
        # The MR's ID.
        id: uint(..u32-max)
        # The bank's algorithm.
        hash-algo: hash-algo
      # The privilege level to report for, as configfs-tsm's privlevel.
      privlevel?: uint(..u32-max)
      # The service to attest, as configfs-tsm's service_provider; only with
      # service-guid and service-manifest-version.
      service-provider?: string(1..128)
      # The service's GUID, as configfs-tsm's service_guid.
      service-guid?: binary(16)
      # Its manifest version, as configfs-tsm's service_manifest_version.
      service-manifest-version?: uint(..u32-max)
      # The device's family's fields.
      options?: extension evidence-options
    reply:
      device-generation: record
      # One per object, in request order.
      results[16]:
        # The layout it came in, where a standard defines it. Exactly one of
        # format and vendor-format is present.
        format?: evidence-format
        # The layout it came in, where its vendor defines it.
        vendor-format?: evidence-vendor-format
        # The bytes written to its blob.
        length: uint
        # Where the TCB vouches for the object, the digest it vouches with.
        tcb-digest?:
          # The object's tcb-digest-algo.
          hash-algo: hash-algo
          # The digest, as long as hash-algo's.
          data: binary(16..64)
      # Present when the evidence depends on the MRs.
      mr-generation?: record
      # On a device with evidence-accept, numbers this evidence for it.
      evidence-generation?: uint(..u32-max)

  # The MRs' IDs and descriptions, which change only as MRs come and go or IMA
  # starts and stops; mr-read returns values, which change with every
  # extension and are read from the hardware.
  mr-get:
    type: query
    fd-access: read
    optional: true
    suggested-reply-length: 4K
    request:
      # Only this MR; every MR without it.
      id?: uint(..u32-max)
    reply:
      # One per MR, ordered by ID.
      items[]:
        # The device's handle for the MR in requests.
        id: uint(..u32-max)
        $include: mr-desc

  # One MR's values, and the MR generation they belong to.
  mr-read:
    type: query
    fd-access: read
    optional: true
    suggested-reply-length: 4K
    request:
      # The MR to read, by the ID mr-get lists.
      id: uint(..u32-max)
      device-generation?: record
      # The device's family's fields.
      options?: extension mr-options
    reply:
      device-generation: record
      mr-generation: record
      mr-values: record

  # Extends banks of the MR by digests, as TPM2_PCR_Extend, or every bank by
  # the hash of raw-data, as TPM2_PCR_Event. A request takes one of the two.
  mr-extend:
    type: action
    fd-access: read-write
    optional: true
    request:
      # The MR to extend, by the ID mr-get lists.
      id: uint(..u32-max)
      # For the banks to extend, each once, in any order.
      mr-values?: record
      # Data the device hashes for each bank, in place of the caller's digests.
      raw-data?: blob(in, va memfd dma-buf)
      device-generation?: record
      # The device's family's fields.
      options?: extension mr-options
      # What the data extended by is, recorded in the journal with it.
      record?:
        # The layout of data, in printable ASCII without spaces.
        format: string(1..128)
        # What was measured, laid out as format says.
        data: binary(..4K)
    reply:
      device-generation: record
      mr-generation: record
      # The digest each extended bank was extended by.
      mr-values: record

  # The device generation advanced.
  device-state-changed:
    type: event
    payload:
      device-generation: record

  # A journal entry was added.
  mr-log-entry-appended:
    type: event
    payload:
      # The entry, as mr-log-get returns it.
      entry: record mr-log-entry

  # The verifier accepted the evidence of evidence-generation, so the provider
  # runs the device, as TDISP's RUN. That advances the device generation.
  evidence-accept:
    type: action
    fd-access: read-write
    availability: dynamic
    optional: true
    request:
      device-generation: record
      # The evidence the verifier accepted, as evidence-get numbered it.
      evidence-generation: uint(..u32-max)
    reply:
      device-generation: record

  # The device's security state.
  devsec-state-get:
    type: query
    fd-access: read
    optional: true
    suggested-reply-length: 1K
    reply:
      device-generation: record
      # The device interface's TDISP state, where the provider reports one.
      tdisp-state?: tdisp-state

  # Evidence was produced, or a device state change retired it.
  evidence-state-changed:
    type: event
    payload:
      device-generation: record
      # The latest evidence, once evidence of this device state exists.
      evidence-generation?: uint(..u32-max)

  # Entries of the MR journal, of the MRs and the generations the request
  # selects.
  mr-log-get:
    type: query
    fd-access: read
    optional: true
    suggested-reply-length: 128K
    request:
      # Only these MRs' entries; every MR's without it.
      selection[256]?:
        # An MR's ID.
        id: uint(..u32-max)
      mr-start-generation?: record
      mr-end-generation?: record
    reply:
      mr-start-generation?: record
      mr-end-generation?: record
      # The entries, in journal order.
      entries[]?: record mr-log-entry
