%YAML 1.2
---
# Generated files for registered families.
version: 1
registry:
  source: Documentation/ctlv/families.yaml
  outputs:
    uapi-header: include/uapi/linux/ctlv_families_gen.h

families:
  - name: ctlv
    source: Documentation/ctlv/specs/ctlv.yaml
    outputs:
      uapi-header: include/uapi/linux/ctlv_gen.h
      kernel-header: include/linux/ctlv_gen.h
      kernel-source: drivers/ctlv/ctlv_gen.c
      user-source: tools/ctlv/libctlv/ctlv_user_gen.c

  - name: ctlv-attestation
    source: Documentation/ctlv/specs/ctlv-attestation.yaml
    outputs:
      uapi-header: include/uapi/linux/ctlv_attestation_gen.h
      kernel-header: drivers/attestation/generated/ctlv_attestation_gen.h
      kernel-source: drivers/attestation/generated/ctlv_attestation_gen.c
      user-header: >-
        tools/testing/selftests/attestation/ctlv_attestation_user_gen.h
      user-source: >-
        tools/testing/selftests/attestation/ctlv_attestation_user_gen.c

  - name: ctlv-attestation-tdx
    source: Documentation/ctlv/specs/ctlv-attestation-tdx.yaml
    outputs:
      uapi-header: include/uapi/linux/ctlv_attestation_tdx_gen.h
      kernel-header: drivers/attestation/generated/ctlv_attestation_tdx_gen.h
      kernel-source: drivers/attestation/generated/ctlv_attestation_tdx_gen.c
      user-header: >-
        tools/testing/selftests/attestation/ctlv_attestation_tdx_user_gen.h
      user-source: >-
        tools/testing/selftests/attestation/ctlv_attestation_tdx_user_gen.c

  - name: ctlv-test
    source: Documentation/ctlv/specs/ctlv-test.yaml
    outputs:
      uapi-header: include/uapi/linux/ctlv_test_gen.h
      kernel-header: drivers/ctlv/tests/ctlv_test_gen.h
      kernel-source: drivers/ctlv/tests/ctlv_test_gen.c
      user-header: tools/testing/selftests/ctlv/ctlv_test_user_gen.h
      user-source: tools/testing/selftests/ctlv/ctlv_test_user_gen.c

  - name: ctlv-test-child
    source: Documentation/ctlv/specs/ctlv-test-child.yaml
    outputs:
      uapi-header: include/uapi/linux/ctlv_test_child_gen.h
      kernel-header: drivers/ctlv/tests/ctlv_test_child_gen.h
      kernel-source: drivers/ctlv/tests/ctlv_test_child_gen.c
      user-header: tools/testing/selftests/ctlv/ctlv_test_child_user_gen.h
      user-source: tools/testing/selftests/ctlv/ctlv_test_child_user_gen.c

  - name: ctlv-attestation-sim
    source: Documentation/ctlv/specs/ctlv-attestation-sim.yaml
    outputs:
      uapi-header: include/uapi/linux/ctlv_attestation_sim_gen.h
      kernel-header: drivers/attestation/generated/ctlv_attestation_sim_gen.h
      kernel-source: drivers/attestation/generated/ctlv_attestation_sim_gen.c
      user-header: >-
        tools/testing/selftests/attestation/ctlv_attestation_sim_user_gen.h
      user-source: >-
        tools/testing/selftests/attestation/ctlv_attestation_sim_user_gen.c
