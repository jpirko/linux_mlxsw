%YAML 1.2
---
$schema: https://json-schema.org/draft-07/schema

$defs:
  path:
    type: string
    minLength: 1
    pattern: ^[^/].*$

  outputs:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      uapi-header:
        $ref: '#/$defs/path'
      kernel-header:
        $ref: '#/$defs/path'
      kernel-source:
        $ref: '#/$defs/path'
      user-header:
        $ref: '#/$defs/path'
      user-source:
        $ref: '#/$defs/path'
      doc-rst:
        $ref: '#/$defs/path'

  family:
    type: object
    required: [ name, scope, spec, outputs ]
    additionalProperties: false
    properties:
      name:
        type: string
      scope:
        enum: [ registered, fixture ]
      spec:
        $ref: '#/$defs/path'
      outputs:
        $ref: '#/$defs/outputs'

title: CTLV generated-file manifest
type: object
required: [ version, families ]
additionalProperties: false
properties:
  version:
    const: 1
  families:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/family'
